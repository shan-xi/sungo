server:
  port: 8080
spring:
  application:
    name: sungo-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sungo}
    username: ${DATABASE_USERNAME:sungo_app}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-must-be-replaced-before-production-123456}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:change-this-password}
  upload-dir: ${UPLOAD_DIR:./uploads}
